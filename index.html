<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CQB Tactical — Top-Down Squad Prototype</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0c1210;
        overflow: hidden;
        font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
        color: #e8f0e8;
    }
    #game { width: 100%; height: 100%; }
    canvas { display: block; }
    #boot-error {
        display: none;
        position: absolute;
        inset: 0;
        place-content: center;
        text-align: center;
        padding: 2rem;
        line-height: 1.6;
    }
    #boot-error code {
        background: #1c2a22;
        padding: 0.15em 0.4em;
        border-radius: 4px;
    }
</style>
</head>
<body>
<div id="game"></div>
<div id="boot-error">
    <h1>Phaser failed to load</h1>
    <p>The engine is loaded from a CDN with a local copy in <code>vendor/phaser.min.js</code> as fallback.<br>
       Check your connection, or make sure the <code>vendor/</code> folder was served alongside this page.</p>
</div>

<!-- Engine and audio: CDN first, vendored copies as offline fallback. -->
<script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
<script>
    if (!window.Phaser) {
        document.write('<script src="vendor/phaser.min.js"><\/script>');
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
<script>
    if (!window.Howl) {
        document.write('<script src="vendor/howler.min.js"><\/script>');
    }
</script>
<script>
    window.addEventListener('load', () => {
        if (!window.Phaser) {
            document.getElementById('boot-error').style.display = 'grid';
        }
    });
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
